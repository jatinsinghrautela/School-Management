name: Web and API checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  mysql-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: orbit_ci
          MYSQL_USER: orbit
          MYSQL_PASSWORD: synthetic-ci-app-only
          MYSQL_ROOT_PASSWORD: synthetic-ci-root-only
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: orbit_ci
      MYSQL_USER: orbit
      MYSQL_PASSWORD: synthetic-ci-app-only
      RESTORE_MYSQL_USER: root
      RESTORE_MYSQL_PASSWORD: synthetic-ci-root-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:security
      - run: npm run db:relational
      - run: npm run db:operations
      - run: npm run db:recovery
      - run: npm run db:permissions
