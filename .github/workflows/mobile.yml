name: Mobile foundation checks
on:
  push:
    paths:
      - "apps/mobile/**"
      - "apps/api/src/**"
      - "scripts/mobile-preview-check.mjs"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "apps/api/src/**"
      - "scripts/mobile-preview-check.mjs"
      - ".github/workflows/mobile.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - run: npm --prefix apps/mobile ci
      - run: npm run mobile:check
      - run: npx expo export --platform android --platform ios --platform web --max-workers 2
        working-directory: apps/mobile
        env:
          CI: "1"
      - run: npx playwright install --with-deps chromium
      - run: node scripts/mobile-preview-check.mjs
