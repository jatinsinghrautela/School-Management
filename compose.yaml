services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: orbit_school
      MYSQL_USER: orbit
      MYSQL_PASSWORD: local-development-only
      MYSQL_ROOT_PASSWORD: local-root-development-only
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - orbit_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 12
volumes:
  orbit_mysql:
